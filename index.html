<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Affiliate Content Distribution Portal</title>
  
  <!-- Google Fonts: Inter & Noto Sans Bengali -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================
       CSS DESIGN SYSTEM & VARIABLES
       ===================================================== */
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --accent: #06b6d4;
      --bg-page: #0f172a;
      --bg-surface: #1e293b;
      --bg-surface-elevated: #334155;
      --border-subtle: #334155;
      --border-focus: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      --font-family: 'Inter', 'Noto Sans Bengali', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Containers */
    .app-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.25rem 4rem 1.25rem;
      flex: 1;
    }

    /* Header */
    header.site-header {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      font-size: 1.2rem;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success-bg);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--success);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Controls Bar */
    .controls-bar {
      margin: 2rem 0 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media (min-width: 640px) {
      .controls-bar {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 480px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      outline: none;
      transition: var(--transition-smooth);
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .stats-counter {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stats-counter strong {
      color: var(--text-main);
    }

    /* Grid Layout */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1100px) {
      .cards-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Content Card */
    .content-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .content-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-3px);
    }

    .card-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }

    .card-index {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(6, 182, 212, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-time {
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.45;
      margin-bottom: 0.75rem;
      word-break: break-word;
    }

    .card-description {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 1.2rem;
      word-break: break-word;
      white-space: pre-line;
      background: rgba(15, 23, 42, 0.5);
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.03);
      max-height: 180px;
      overflow-y: auto;
    }

    /* Scrollbar for Description */
    .card-description::-webkit-scrollbar {
      width: 4px;
    }
    .card-description::-webkit-scrollbar-thumb {
      background: var(--bg-surface-elevated);
      border-radius: 4px;
    }

    /* Video & Product URL sections */
    .links-section {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
      font-size: 0.82rem;
    }

    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.35);
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .link-label {
      color: var(--text-dim);
      font-weight: 600;
      min-width: 50px;
    }

    .link-url-text {
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-decoration: none;
      transition: var(--transition-smooth);
      flex: 1;
    }

    .link-url-text:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    /* Buttons */
    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: auto;
    }

    .btn-claim {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      border: none;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: var(--transition-smooth);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }

    .btn-claim:hover:not(:disabled) {
      background: linear-gradient(135deg, #5b52f3, #4338ca);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.45);
    }

    .btn-claim:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-claim:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      filter: grayscale(0.5);
    }

    .individual-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.4rem;
    }

    .btn-sub-copy {
      background: var(--bg-surface-elevated);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.45rem 0.6rem;
      border-radius: var(--radius-sm);
      font-size: 0.74rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      transition: var(--transition-smooth);
    }

    .btn-sub-copy:hover {
      background: #475569;
      color: #fff;
    }

    /* Loading Skeletons */
    .skeleton-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .skeleton-line {
      background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Empty and Error State */
    .state-container {
      text-align: center;
      padding: 5rem 1.5rem;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-subtle);
      margin-top: 2rem;
    }

    .state-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
    }

    .state-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .state-desc {
      color: var(--text-muted);
      font-size: 0.92rem;
      max-width: 420px;
      margin: 0 auto;
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      max-width: 90vw;
    }

    .toast {
      pointer-events: auto;
      background: #1e293b;
      color: #fff;
      padding: 0.9rem 1.2rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      font-size: 0.88rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      border-left: 4px solid var(--primary);
    }

    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warning); }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(0.95); }
    }

    /* Spin icon */
    .spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-group">
        <div class="brand-logo">A</div>
        <div class="brand-text">
          <h1>Affiliate Content Pool</h1>
          <p>Real-Time Claim & Distribute Platform</p>
        </div>
      </div>
      <div class="badge-live">
        <span class="pulse-dot"></span>
        <span>Live Sync Active</span>
      </div>
    </div>
  </header>

  <!-- Main User Area -->
  <main class="app-container">
    
    <!-- Controls (Search & Counters) -->
    <section class="controls-bar">
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by title, description or hashtags..." aria-label="Search Content" />
      </div>
      <div class="stats-counter" id="statsCounter">
        Loading items...
      </div>
    </section>

    <!-- Content Items Grid -->
    <section id="contentGrid" class="cards-grid" aria-live="polite">
      <!-- Loading skeleton items rendered here via JS -->
    </section>

  </main>

  <!-- Global Toast Notifications Stack -->
  <div class="toast-container" id="toastContainer" aria-live="assertive"></div>

  <!-- Firebase Modular SDK & Application Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      query, 
      where, 
      orderBy, 
      onSnapshot, 
      runTransaction, 
      doc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // =====================================================
    // 🔥 FIREBASE CONFIGURATION — PASTE YOUR FIREBASE
    // CONSOLE CONFIG HERE
    // =====================================================
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBbHi-Kwq9gJ_20QNrlqY4RkSVRVPZSAMM",
  authDomain: "ruvoxyman.firebaseapp.com",
  projectId: "ruvoxyman",
  storageBucket: "ruvoxyman.firebasestorage.app",
  messagingSenderId: "917262973960",
  appId: "1:917262973960:web:ea75e80b5d2bc83948e5bd",
  measurementId: "G-RE17Y3VGL2"
};

    // =====================================================
    // END FIREBASE CONFIGURATION
    // =====================================================

    // State Variables
    let db = null;
    let allAvailableItems = [];
    let isFirebaseConfigured = false;
    let unsubscribeFirestore = null;

    // DOM Elements
    const contentGrid = document.getElementById("contentGrid");
    const searchInput = document.getElementById("searchInput");
    const statsCounter = document.getElementById("statsCounter");
    const toastContainer = document.getElementById("toastContainer");

    // Initialize Firebase safely
    try {
      if (firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("PASTE_YOUR")) {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        isFirebaseConfigured = true;
      }
    } catch (err) {
      console.error("Firebase Initialization Error:", err);
    }

    // ==========================================
    // TOAST NOTIFICATION UTILITY
    // ==========================================
    function showToast(message, type = "info", duration = 4000) {
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      
      const icons = {
        success: `✓`,
        error: `✕`,
        warning: `⚠`,
        info: `ℹ`
      };

      toast.innerHTML = `<span>${icons[type] || 'ℹ'}</span> <span>${escapeHtml(message)}</span>`;
      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = "fadeOut 0.3s forwards";
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    // ==========================================
    // HELPER FUNCTIONS & FORMATTERS
    // ==========================================
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function sanitizeUrl(url) {
      if (!url) return "#";
      const trimmed = url.trim();
      if (/^https?:\/\//i.test(trimmed)) {
        return trimmed;
      }
      return "#";
    }

    // Clipboard copy with robust fallback
    async function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (err) {
          console.warn("Clipboard API failed, using fallback textarea:", err);
        }
      }

      // Fallback
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      textArea.style.top = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      
      let successful = false;
      try {
        successful = document.execCommand("copy");
      } catch (err) {
        console.error("ExecCommand copy failed:", err);
      }
      textArea.remove();
      return successful;
    }

    // Unique anonymous client device session ID
    function getClientSessionId() {
      let id = sessionStorage.getItem("app_client_session_id");
      if (!id) {
        id = "anon_" + Math.random().toString(36).substring(2, 12) + "_" + Date.now();
        sessionStorage.setItem("app_client_session_id", id);
      }
      return id;
    }

    // Format content item for complete clipboard copy
    function formatCompleteCopyPayload(item) {
      return `Title:\n${item.title || ''}\n\nDescription:\n${item.description || ''}\n\nVideo:\n${item.videoUrl || ''}\n\nProduct:\n${item.productUrl || ''}`;
    }

    // ==========================================
    // SKELETON & UI RENDERING
    // ==========================================
    function renderSkeletons(count = 6) {
      let skeletonsHtml = "";
      for (let i = 0; i < count; i++) {
        skeletonsHtml += `
          <div class="skeleton-card">
            <div class="skeleton-line" style="height: 20px; width: 30%;"></div>
            <div class="skeleton-line" style="height: 28px; width: 90%;"></div>
            <div class="skeleton-line" style="height: 100px; width: 100%;"></div>
            <div class="skeleton-line" style="height: 35px; width: 100%;"></div>
            <div class="skeleton-line" style="height: 48px; width: 100%; margin-top: auto;"></div>
          </div>
        `;
      }
      contentGrid.innerHTML = skeletonsHtml;
    }

    function renderEmptyState(message = "No content is currently available.", subtext = "Please check back later. When the admin publishes new affiliate content, it will appear here automatically in real time.") {
      contentGrid.innerHTML = `
        <div class="state-container" style="grid-column: 1 / -1;">
          <div class="state-icon">📦</div>
          <h2 class="state-title">${escapeHtml(message)}</h2>
          <p class="state-desc">${escapeHtml(subtext)}</p>
        </div>
      `;
      statsCounter.innerHTML = `Available Items: <strong>0</strong>`;
    }

    function renderUnconfiguredState() {
      contentGrid.innerHTML = `
        <div class="state-container" style="grid-column: 1 / -1; border-color: var(--warning);">
          <div class="state-icon">⚙️</div>
          <h2 class="state-title">Firebase Configuration Required</h2>
          <p class="state-desc">Please paste your genuine Firebase project credentials inside the <code>firebaseConfig</code> object in <code>index.html</code> to start listening for live content.</p>
        </div>
      `;
      statsCounter.innerHTML = `Status: <strong style="color:var(--warning)">Not Connected</strong>`;
    }

    function renderCards(items) {
      if (!items || items.length === 0) {
        if (searchInput.value.trim().length > 0) {
          renderEmptyState("No matching content found", "Try refining your search keyword.");
        } else {
          renderEmptyState();
        }
        return;
      }

      statsCounter.innerHTML = `Available Items: <strong>${items.length}</strong>`;

      contentGrid.innerHTML = items.map((item, index) => {
        const safeVideoUrl = sanitizeUrl(item.videoUrl);
        const safeProductUrl = sanitizeUrl(item.productUrl);
        const hasValidVideo = safeVideoUrl !== "#";
        const hasValidProduct = safeProductUrl !== "#";

        return `
          <article class="content-card" id="card-${item.id}" data-id="${item.id}">
            <div>
              <div class="card-badge-row">
                <span class="card-index">Item #${index + 1}</span>
                <span class="card-time">Available</span>
              </div>
              
              <h2 class="card-title">${escapeHtml(item.title)}</h2>
              
              <div class="card-description">${escapeHtml(item.description)}</div>

              <div class="links-section">
                <div class="link-row">
                  <span class="link-label">Video:</span>
                  ${hasValidVideo ? `
                    <a href="${safeVideoUrl}" target="_blank" rel="noopener noreferrer" class="link-url-text" title="${safeVideoUrl}">
                      ${escapeHtml(item.videoUrl)}
                    </a>
                  ` : `<span class="link-url-text" style="color:var(--text-dim)">No video provided</span>`}
                </div>
                <div class="link-row">
                  <span class="link-label">Product:</span>
                  ${hasValidProduct ? `
                    <a href="${safeProductUrl}" target="_blank" rel="noopener noreferrer" class="link-url-text" title="${safeProductUrl}">
                      ${escapeHtml(item.productUrl)}
                    </a>
                  ` : `<span class="link-url-text" style="color:var(--text-dim)">No product link</span>`}
                </div>
              </div>
            </div>

            <div class="card-actions">
              <!-- Primary Claim & Copy Button -->
              <button type="button" class="btn-claim" data-claim-id="${item.id}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Copy & Claim (Remove)</span>
              </button>

              <!-- Optional Individual Quick Previews / Field Copies -->
              <div class="individual-actions">
                <button type="button" class="btn-sub-copy" data-copy-field="title" data-item-id="${item.id}">
                  Copy Title
                </button>
                <button type="button" class="btn-sub-copy" data-copy-field="description" data-item-id="${item.id}">
                  Copy Desc
                </button>
                <button type="button" class="btn-sub-copy" data-copy-field="videoUrl" data-item-id="${item.id}">
                  Copy Video
                </button>
                <button type="button" class="btn-sub-copy" data-copy-field="productUrl" data-item-id="${item.id}">
                  Copy Product
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");

      attachCardEventListeners();
    }

    // ==========================================
    // ATOMIC CLAIM & CONCURRENCY HANDLER
    // ==========================================
    async function handleClaimAndCopy(contentId, buttonElement) {
      if (!db) {
        showToast("Database not initialized", "error");
        return;
      }

      // UI Loading state on button
      const originalButtonContent = buttonElement.innerHTML;
      buttonElement.disabled = true;
      buttonElement.innerHTML = `
        <svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-linecap="round"></circle>
        </svg>
        <span>Verifying & Claiming...</span>
      `;

      const docRef = doc(db, "contentItems", contentId);
      const clientSessionId = getClientSessionId();

      try {
        let claimedData = null;

        // Run atomic Firestore transaction
        await runTransaction(db, async (transaction) => {
          const docSnap = await transaction.get(docRef);

          if (!docSnap.exists()) {
            throw new Error("ALREADY_CLAIMED_OR_DELETED");
          }

          const data = docSnap.data();

          if (data.status !== "available") {
            throw new Error("ALREADY_CLAIMED");
          }

          // Atomically change status
          transaction.update(docRef, {
            status: "claimed",
            claimedAt: serverTimestamp(),
            claimedBySession: clientSessionId
          });

          claimedData = data;
        });

        // If transaction passed: Prepare formatted text & copy to clipboard
        if (claimedData) {
          const payload = formatCompleteCopyPayload(claimedData);
          const copySuccess = await copyTextToClipboard(payload);

          if (copySuccess) {
            showToast("✓ Claimed & Copied to clipboard!", "success");
          } else {
            showToast("✓ Item claimed! Please copy content manually.", "warning");
          }

          // Optimistically animate removal (onSnapshot will also handle real-time sync)
          const cardEl = document.getElementById(`card-${contentId}`);
          if (cardEl) {
            cardEl.style.transition = "transform 0.3s ease, opacity 0.3s ease";
            cardEl.style.opacity = "0";
            cardEl.style.transform = "scale(0.95)";
            setTimeout(() => {
              allAvailableItems = allAvailableItems.filter(i => i.id !== contentId);
              applySearchFilter();
            }, 300);
          }
        }

      } catch (err) {
        console.error("Claim transaction error:", err);
        buttonElement.disabled = false;
        buttonElement.innerHTML = originalButtonContent;

        if (err.message === "ALREADY_CLAIMED" || err.message === "ALREADY_CLAIMED_OR_DELETED") {
          showToast("⚠ This item was just claimed by another user.", "warning");
          // Remove from local cache
          allAvailableItems = allAvailableItems.filter(i => i.id !== contentId);
          applySearchFilter();
        } else {
          showToast("Failed to claim content. Check network connection.", "error");
        }
      }
    }

    // Individual field copier (without claiming/deleting)
    async function handleFieldCopy(field, itemId) {
      const item = allAvailableItems.find(i => i.id === itemId);
      if (!item) return;

      const valueToCopy = item[field] || "";
      if (!valueToCopy) {
        showToast(`This item has no ${field}.`, "warning");
        return;
      }

      const success = await copyTextToClipboard(valueToCopy);
      if (success) {
        showToast(`✓ Copied ${field} to clipboard!`, "success");
      } else {
        showToast(`Unable to copy ${field}.`, "error");
      }
    }

    // ==========================================
    // ATTACH DOM LISTENERS
    // ==========================================
    function attachCardEventListeners() {
      // Claim buttons
      document.querySelectorAll("[data-claim-id]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const contentId = btn.getAttribute("data-claim-id");
          handleClaimAndCopy(contentId, btn);
        });
      });

      // Individual field copy buttons
      document.querySelectorAll("[data-copy-field]").forEach(btn => {
        btn.addEventListener("click", () => {
          const field = btn.getAttribute("data-copy-field");
          const itemId = btn.getAttribute("data-item-id");
          handleFieldCopy(field, itemId);
        });
      });
    }

    // Filter & Search Logic
    function applySearchFilter() {
      const queryText = searchInput.value.toLowerCase().trim();
      if (!queryText) {
        renderCards(allAvailableItems);
        return;
      }

      const filtered = allAvailableItems.filter(item => {
        const titleMatch = (item.title || "").toLowerCase().includes(queryText);
        const descMatch = (item.description || "").toLowerCase().includes(queryText);
        return titleMatch || descMatch;
      });

      renderCards(filtered);
    }

    searchInput.addEventListener("input", applySearchFilter);

    // ==========================================
    // REAL-TIME FIRESTORE LISTENER
    // ==========================================
    function setupRealTimeListener() {
      if (!isFirebaseConfigured || !db) {
        renderUnconfiguredState();
        return;
      }

      renderSkeletons(6);

      const itemsCollection = collection(db, "contentItems");
      
      // Query documents where status == 'available'
      const q = query(
        itemsCollection,
        where("status", "==", "available")
      );

      unsubscribeFirestore = onSnapshot(q, (snapshot) => {
        const items = [];
        snapshot.forEach((docSnapshot) => {
          items.push({
            id: docSnapshot.id,
            ...docSnapshot.data()
          });
        });

        // Client-side sort by createdAt descending if present
        items.sort((a, b) => {
          const timeA = a.createdAt?.seconds || 0;
          const timeB = b.createdAt?.seconds || 0;
          return timeB - timeA;
        });

        allAvailableItems = items;
        applySearchFilter();

      }, (error) => {
        console.error("Firestore snapshot error:", error);
        showToast("Error connecting to real-time database.", "error");
        renderEmptyState("Database Connection Error", "Unable to fetch content items. Verify Firestore security rules or connection.");
      });
    }

    // App Initialization
    document.addEventListener("DOMContentLoaded", () => {
      setupRealTimeListener();
    });
  </script>
</body>
</html>
