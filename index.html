<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Affiliate Content Portal</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #06b6d4;
      --bg-page: #0b0f19;
      --bg-surface: #151d30;
      --bg-surface-elevated: #1e293b;
      --bg-input: #0d1322;
      --border-subtle: #243049;
      --border-focus: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition-smooth: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem 1rem;
      flex: 1;
    }

    /* Clean Minimal Header */
    .clean-header {
      text-align: center;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .clean-header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .clean-header p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .item-counter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(79, 70, 229, 0.15);
      border: 1px solid rgba(79, 70, 229, 0.3);
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-top: 0.25rem;
    }

    /* Search Bar */
    .search-wrapper {
      width: 100%;
      max-width: 540px;
      margin: 0.75rem auto 0 auto;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.8rem 1rem 0.8rem 2.6rem;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      outline: none;
      transition: var(--transition-smooth);
    }

    .search-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    /* Grid Layout */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    @media (min-width: 768px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 1060px) {
      .cards-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* Card */
    .content-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
      transition: var(--transition-smooth);
    }

    .content-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }

    .card-top {
      margin-bottom: 0.75rem;
    }

    .card-index {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(6, 182, 212, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.45;
      margin-bottom: 0.75rem;
      word-break: break-word;
    }

    .card-description {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1rem;
      word-break: break-word;
      white-space: pre-line;
      background: var(--bg-input);
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.03);
      max-height: 150px;
      overflow-y: auto;
    }

    /* Media & Link Action Buttons */
    .quick-links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .btn-download-media, .btn-open-product {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.65rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: var(--transition-smooth);
    }

    .btn-download-media {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .btn-download-media:hover {
      background: rgba(6, 182, 212, 0.25);
    }

    .btn-open-product {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .btn-open-product:hover {
      background: rgba(16, 185, 129, 0.25);
    }

    /* Action Footer */
    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-top: auto;
    }

    .btn-claim {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
      border: none;
      padding: 0.8rem 1rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: var(--transition-smooth);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }

    .btn-claim:hover:not(:disabled) {
      background: linear-gradient(135deg, #5b52f3, #4338ca);
      transform: translateY(-1px);
    }

    .btn-claim:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .sub-copy-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.35rem;
    }

    .btn-sub-copy {
      background: var(--bg-surface-elevated);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.4rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: var(--transition-smooth);
    }

    .btn-sub-copy:hover {
      background: #334155;
      color: #fff;
    }

    /* Loading Skeletons */
    .skeleton-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      min-height: 340px;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .skeleton-line {
      background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* States */
    .state-container {
      text-align: center;
      padding: 4rem 1.5rem;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-subtle);
      margin-top: 1rem;
    }

    .state-icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .state-title { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 0.4rem; }
    .state-desc { color: var(--text-muted); font-size: 0.88rem; max-width: 400px; margin: 0 auto; }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      max-width: 90vw;
    }

    .toast {
      pointer-events: auto;
      background: #1e293b;
      color: #fff;
      padding: 0.85rem 1.15rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      font-size: 0.88rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-left: 4px solid var(--primary);
      animation: slideUp 0.25s ease forwards;
    }

    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warning); }

    @keyframes slideUp {
      from { transform: translateY(15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <main class="app-container">
    
    <!-- Clean Minimal Top Section -->
    <header class="clean-header">
      <h1>Affiliate Content Pool</h1>
      <p>Instant claim, direct video download & one-click product access</p>
      <div class="item-counter-pill" id="statsCounter">
        Loading items...
      </div>

      <!-- Search Bar -->
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by title, description or keyword..." aria-label="Search content" />
      </div>
    </header>

    <!-- Cards Grid -->
    <section id="contentGrid" class="cards-grid" aria-live="polite">
      <!-- Loading skeletons rendered here -->
    </section>

  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="assertive"></div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      query, 
      where, 
      onSnapshot, 
      runTransaction, 
      doc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // =====================================================
    // 🔥 FIREBASE CONFIGURATION — PASTE YOUR FIREBASE
    // CONSOLE CONFIG HERE
    // =====================================================
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBbHi-Kwq9gJ_20QNrlqY4RkSVRVPZSAMM",
  authDomain: "ruvoxyman.firebaseapp.com",
  projectId: "ruvoxyman",
  storageBucket: "ruvoxyman.firebasestorage.app",
  messagingSenderId: "917262973960",
  appId: "1:917262973960:web:ea75e80b5d2bc83948e5bd",
  measurementId: "G-RE17Y3VGL2"
};

    // =====================================================
    // END FIREBASE CONFIGURATION
    // =====================================================

    let db = null;
    let allAvailableItems = [];
    let isFirebaseConfigured = false;

    const contentGrid = document.getElementById("contentGrid");
    const searchInput = document.getElementById("searchInput");
    const statsCounter = document.getElementById("statsCounter");
    const toastContainer = document.getElementById("toastContainer");

    try {
      if (firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("PASTE_YOUR")) {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        isFirebaseConfigured = true;
      }
    } catch (err) {
      console.error("Firebase init failed:", err);
    }

    // Toast Utility
    function showToast(message, type = "info", duration = 3500) {
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      const icons = { success: "✓", error: "✕", warning: "⚠", info: "ℹ" };
      toast.innerHTML = `<span>${icons[type] || 'ℹ'}</span> <span>${escapeHtml(message)}</span>`;
      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "scale(0.95)";
        setTimeout(() => toast.remove(), 250);
      }, duration);
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function sanitizeUrl(url) {
      if (!url) return "#";
      const trimmed = url.trim();
      return /^https?:\/\//i.test(trimmed) ? trimmed : "#";
    }

    async function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (_) {}
      }
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (_) {}
      textArea.remove();
      return ok;
    }

    function getClientSessionId() {
      let id = sessionStorage.getItem("app_client_id");
      if (!id) {
        id = "anon_" + Math.random().toString(36).substring(2, 10) + "_" + Date.now();
        sessionStorage.setItem("app_client_id", id);
      }
      return id;
    }

    function formatFullPayload(item) {
      return `Title:\n${item.title || ''}\n\nDescription:\n${item.description || ''}\n\nVideo:\n${item.videoUrl || ''}\n\nProduct:\n${item.productUrl || ''}`;
    }

    // Direct Instant Video Download Handler
    async function triggerDirectDownload(videoUrl, title) {
      if (!videoUrl || videoUrl === "#") {
        showToast("No valid video URL available.", "warning");
        return;
      }

      showToast("Starting video download...", "info", 2000);

      try {
        // Fetch as blob to force browser/mobile gallery download
        const response = await fetch(videoUrl, { mode: 'cors' });
        if (!response.ok) throw new Error("CORS / Network restriction");
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.style.display = "none";
        a.href = blobUrl;
        const cleanName = (title || "video").replace(/[^a-zA-Z0-9]/g, "_").substring(0, 30);
        a.download = `${cleanName}.mp4`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(blobUrl);
        a.remove();
        showToast("✓ Video download started!", "success");
      } catch (err) {
        // Fallback for cross-origin URLs or external video platforms
        const a = document.createElement("a");
        a.href = videoUrl;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.download = "video.mp4";
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast("Opening video source directly.", "info");
      }
    }

    // Render Skeletons
    function renderSkeletons(count = 6) {
      contentGrid.innerHTML = Array(count).fill(`
        <div class="skeleton-card">
          <div class="skeleton-line" style="height: 18px; width: 25%;"></div>
          <div class="skeleton-line" style="height: 24px; width: 85%;"></div>
          <div class="skeleton-line" style="height: 80px; width: 100%;"></div>
          <div class="skeleton-line" style="height: 38px; width: 100%;"></div>
          <div class="skeleton-line" style="height: 44px; width: 100%; margin-top: auto;"></div>
        </div>
      `).join("");
    }

    function renderEmptyState(message = "No content available right now.", subtext = "When new entries are published from the Admin Panel, they will appear here live.") {
      contentGrid.innerHTML = `
        <div class="state-container" style="grid-column: 1 / -1;">
          <div class="state-icon">📦</div>
          <h2 class="state-title">${escapeHtml(message)}</h2>
          <p class="state-desc">${escapeHtml(subtext)}</p>
        </div>
      `;
      statsCounter.textContent = `0 Available Items`;
    }

    function renderCards(items) {
      if (!items || items.length === 0) {
        if (searchInput.value.trim().length > 0) {
          renderEmptyState("No matching items found", "Try different search terms.");
        } else {
          renderEmptyState();
        }
        return;
      }

      statsCounter.textContent = `${items.length} Available Items`;

      contentGrid.innerHTML = items.map((item, index) => {
        const safeVideo = sanitizeUrl(item.videoUrl);
        const safeProduct = sanitizeUrl(item.productUrl);

        return `
          <article class="content-card" id="card-${item.id}">
            <div class="card-top">
              <span class="card-index">Item #${index + 1}</span>
              <h2 class="card-title">${escapeHtml(item.title)}</h2>
              <div class="card-description">${escapeHtml(item.description)}</div>

              <!-- Quick Link Action Buttons -->
              <div class="quick-links-grid">
                <button type="button" class="btn-download-media" data-download-btn="${item.id}">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                  <span>Download</span>
                </button>

                <a href="${safeProduct}" target="_blank" rel="noopener noreferrer" class="btn-open-product">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                  </svg>
                  <span>Open Product</span>
                </a>
              </div>
            </div>

            <!-- Card Actions -->
            <div class="card-actions">
              <button type="button" class="btn-claim" data-claim-id="${item.id}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Copy & Claim (Remove)</span>
              </button>

              <div class="sub-copy-grid">
                <button type="button" class="btn-sub-copy" data-copy-field="title" data-item-id="${item.id}">Copy Title</button>
                <button type="button" class="btn-sub-copy" data-copy-field="description" data-item-id="${item.id}">Copy Desc</button>
                <button type="button" class="btn-sub-copy" data-copy-field="videoUrl" data-item-id="${item.id}">Copy Video URL</button>
                <button type="button" class="btn-sub-copy" data-copy-field="productUrl" data-item-id="${item.id}">Copy Product URL</button>
              </div>
            </div>
          </article>
        `;
      }).join("");

      attachEventListeners();
    }

    // Atomic Claim Execution
    async function handleClaim(contentId, btn) {
      if (!db) return;

      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-linecap="round"></circle>
        </svg>
        <span>Claiming...</span>
      `;

      const docRef = doc(db, "contentItems", contentId);
      const sessionId = getClientSessionId();

      try {
        let claimedItem = null;

        await runTransaction(db, async (transaction) => {
          const snap = await transaction.get(docRef);
          if (!snap.exists()) throw new Error("TAKEN");
          const data = snap.data();
          if (data.status !== "available") throw new Error("TAKEN");

          transaction.update(docRef, {
            status: "claimed",
            claimedAt: serverTimestamp(),
            claimedBySession: sessionId
          });

          claimedItem = data;
        });

        if (claimedItem) {
          const payload = formatFullPayload(claimedItem);
          const ok = await copyTextToClipboard(payload);
          showToast(ok ? "✓ Content copied & item claimed!" : "✓ Item claimed successfully!", "success");

          const card = document.getElementById(`card-${contentId}`);
          if (card) {
            card.style.opacity = "0";
            card.style.transform = "scale(0.95)";
            setTimeout(() => {
              allAvailableItems = allAvailableItems.filter(i => i.id !== contentId);
              applySearch();
            }, 250);
          }
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        if (err.message === "TAKEN") {
          showToast("⚠ This item was just claimed by another user.", "warning");
          allAvailableItems = allAvailableItems.filter(i => i.id !== contentId);
          applySearch();
        } else {
          showToast("Failed to complete claim. Try again.", "error");
        }
      }
    }

    async function handleFieldCopy(field, itemId) {
      const item = allAvailableItems.find(i => i.id === itemId);
      if (!item || !item[field]) {
        showToast(`No ${field} available.`, "warning");
        return;
      }
      const ok = await copyTextToClipboard(item[field]);
      showToast(ok ? `✓ Copied ${field}!` : `Unable to copy ${field}.`, ok ? "success" : "error");
    }

    function attachEventListeners() {
      // Claim & Copy
      document.querySelectorAll("[data-claim-id]").forEach(btn => {
        btn.addEventListener("click", () => handleClaim(btn.getAttribute("data-claim-id"), btn));
      });

      // Individual field copy
      document.querySelectorAll("[data-copy-field]").forEach(btn => {
        btn.addEventListener("click", () => {
          handleFieldCopy(btn.getAttribute("data-copy-field"), btn.getAttribute("data-item-id"));
        });
      });

      // Direct Video Download
      document.querySelectorAll("[data-download-btn]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-download-btn");
          const item = allAvailableItems.find(i => i.id === id);
          if (item) triggerDirectDownload(item.videoUrl, item.title);
        });
      });
    }

    function applySearch() {
      const queryText = searchInput.value.toLowerCase().trim();
      if (!queryText) {
        renderCards(allAvailableItems);
        return;
      }
      const filtered = allAvailableItems.filter(i => 
        (i.title || "").toLowerCase().includes(queryText) ||
        (i.description || "").toLowerCase().includes(queryText)
      );
      renderCards(filtered);
    }

    searchInput.addEventListener("input", applySearch);

    // Real-Time Listener
    function startRealTimeSync() {
      if (!isFirebaseConfigured || !db) {
        renderEmptyState("Firebase Not Configured", "Please paste your firebaseConfig object into index.html.");
        return;
      }

      renderSkeletons(6);

      const q = query(collection(db, "contentItems"), where("status", "==", "available"));
      onSnapshot(q, (snapshot) => {
        const items = [];
        snapshot.forEach(docSnap => items.push({ id: docSnap.id, ...docSnap.data() }));

        items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        allAvailableItems = items;
        applySearch();
      }, (error) => {
        console.error("Snapshot error:", error);
        showToast("Database connection error.", "error");
      });
    }

    document.addEventListener("DOMContentLoaded", startRealTimeSync);
  </script>
</body>
</html>
